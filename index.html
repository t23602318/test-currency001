    const { useState, useMemo, useRef, useEffect } = React;

    // 组合筛选组件 - 支持手动选择和模糊搜索
    const ComboboxFilter = ({ label, value, onChange, options, placeholder }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const wrapperRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filteredOptions = options.filter(opt => 
        opt.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const displayValue = value || (isOpen ? searchTerm : '');

      return (
        <div ref={wrapperRef} className="relative">
          <label className="block text-sm font-medium text-gray-700 mb-2">{label}</label>
          <div 
            className="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-lg text-sm cursor-pointer hover:border-primary-400 transition-colors flex items-center justify-between"
            onClick={() => setIsOpen(!isOpen)}
          >
            <span className={value ? 'text-gray-900' : 'text-gray-400'}>
              {value || placeholder}
            </span>
            <svg className={`w-4 h-4 text-gray-400 transition-transform ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
            </svg>
          </div>
          
          {isOpen && (
            <div className="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden animate-scaleIn">
              <div className="p-2 border-b border-gray-100">
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder={`搜索${label}...`}
                  className="w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                  autoFocus
                />
              </div>
              <div className="max-h-60 overflow-y-auto">
                <div 
                  className="px-3 py-2 text-sm text-gray-500 hover:bg-gray-50 cursor-pointer"
                  onClick={(e) => {
                    e.stopPropagation();
                    onChange('');
                    setSearchTerm('');
                    setIsOpen(false);
                  }}
                >
                  清空选择
                </div>
                {filteredOptions.length === 0 ? (
                  <div className="px-3 py-2 text-sm text-gray-400">无匹配结果</div>
                ) : (
                  filteredOptions.map((opt, idx) => (
                    <div
                      key={idx}
                      className={`px-3 py-2 text-sm cursor-pointer hover:bg-primary-50 ${
                        value === opt ? 'bg-primary-50 text-primary-600 font-medium' : 'text-gray-700'
                      }`}
                      onClick={(e) => {
                        e.stopPropagation();
                        onChange(opt);
                        setSearchTerm('');
                        setIsOpen(false);
                      }}
                    >
                      {opt}
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

                  </td>
                  <td className="px-6 py-4 text-sm font-bold text-primary-600 font-mono">{currency.code}</td>
                  <td className="px-6 py-4 text-sm font-bold text-gray-900">{currency.faceValue}</td>
                  <td className="px-6 py-4">
                    <span className={`px-3 py-1.5 rounded-full text-xs font-semibold ${
                      currency.circulationStatus === '正常流通' 
                        ? 'bg-green-100 text-green-700' 
                        : 'bg-red-100 text-red-700'
                    }`}>
                      {currency.circulationStatus}
                    </span>
                  </td>
                  <td className="px-6 py-4">
                    {currency.ctripAccept ? (
                      <span className="px-3 py-1.5 rounded-full text-xs font-semibold bg-gradient-to-r from-primary-100 to-primary-200 text-primary-700">{currency.ctripAccept}</span>
                    ) : (
                      <span className="px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-500">待配置</span>
                    )}
                  </td>
                  <td className="px-6 py-4">
                    <div className="flex gap-1">
                      <button onClick={() => onView(currency)} className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors" title="查看">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                      </button>
                      <button onClick={() => onEdit(currency)} className="p-2 text-green-500 hover:bg-green-50 rounded-lg transition-colors" title="编辑">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                      </button>
                      <button onClick={() => onDelete(currency.id)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="删除">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );

    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [currenciesState, setCurrenciesState] = useState(initialCurrencies);
      const [filters, setFilters] = useState({
        name: '', code: '', faceValue: '',
        version: '', circulationStatus: '', ctripAccept: '',
      });
      const [selectedCurrency, setSelectedCurrency] = useState(null);
      const [editingCurrency, setEditingCurrency] = useState(null);
      const [isAddingNew, setIsAddingNew] = useState(false);

      const filteredCurrencies = useMemo(() => {
        return currenciesState.filter(currency => {
          if (filters.name && !currency.name.includes(filters.name)) return false;
          if (filters.code && !currency.code.toLowerCase().includes(filters.code.toLowerCase())) return false;
          if (filters.faceValue && !currency.faceValue.includes(filters.faceValue)) return false;
          if (filters.version && !currency.version.includes(filters.version)) return false;
          if (filters.circulationStatus && currency.circulationStatus !== filters.circulationStatus) return false;
          if (filters.ctripAccept && currency.ctripAccept !== filters.ctripAccept) return false;
          return true;
        });
      }, [currenciesState, filters]);

      const handleFilterChange = (key, value) => setFilters(prev => ({ ...prev, [key]: value }));

      const handleSaveCurrency = (updatedCurrency) => {
        if (updatedCurrency.id) {
          setCurrenciesState(prevCurrencies => 
            prevCurrencies.map(c => c.id === updatedCurrency.id ? updatedCurrency : c)
          );
          alert('货币信息已保存！');
        } else {
          const newCurrency = {
            ...updatedCurrency,
            id: Date.now().toString(),
          };
          setCurrenciesState(prevCurrencies => [...prevCurrencies, newCurrency]);
          alert('货币已添加！');
        }
      };

      const handleDeleteCurrency = (id) => {
        if (window.confirm('确定要删除这条货币记录吗？此操作不可撤销！')) {
          setCurrenciesState(prevCurrencies => prevCurrencies.filter(c => c.id !== id));
          alert('货币已删除！');
        }
      };

      const handleAddNew = () => {
        setIsAddingNew(true);
        setEditingCurrency({
          id: null,
          name: '',
          code: '',
          faceValue: '',
          version: '',
          circulationStatus: '正常流通',
          ctripAccept: '',
          frontImage: '',
          backImage: '',
        });
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 via-primary-50/30 to-gray-50">
          {currentPage === 'home' ? (
            <div className="min-h-screen flex items-center justify-center p-8">
              <div className="max-w-5xl w-full">
                <div className="text-center mb-16 animate-slideUp">
                  <div className="w-24 h-24 gradient-primary rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg">
                    <svg className="w-14 h-14 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                  <h1 className="text-5xl font-bold text-gray-900 mb-4 tracking-tight">货币大全</h1>
                  <p className="text-gray-500 text-lg">快速查询全球货币信息 · 携程外币兑换业务支持系统</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 animate-slideUp" style={{ animationDelay: '0.1s' }}>
                  <button 
                    onClick={() => setCurrentPage('query')}
                    className="bg-white rounded-3xl shadow-soft p-10 hover:shadow-lg transition-all duration-300 text-left group border-2 border-transparent hover:border-primary-200"
                  >
                    <div className="flex items-center gap-6">
                      <div className="w-20 h-20 gradient-primary rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-lg">
                        <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                      </div>
                      <div>
                        <h3 className="text-2xl font-bold text-gray-900 mb-3">货币查询</h3>
                        <p className="text-gray-500 leading-relaxed">按币种名称、三字码、面值、版本等多维度查询货币信息，支持模糊搜索</p>
                      </div>
                    </div>
                  </button>

                  <button 
                    onClick={() => setCurrentPage('admin')}
                    className="bg-white rounded-3xl shadow-soft p-10 hover:shadow-lg transition-all duration-300 text-left group border-2 border-transparent hover:border-green-200"
                  >
                    <div className="flex items-center gap-6">
                      <div className="w-20 h-20 bg-gradient-to-br from-green-500 to-green-600 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-lg">
                        <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
                        </svg>
                      </div>
                      <div>
                        <h3 className="text-2xl font-bold text-gray-900 mb-3">数据管理</h3>
                        <p className="text-gray-500 leading-relaxed">维护货币数据，支持添加、编辑、删除操作，上传真实图片</p>
                      </div>
                    </div>
                  </button>
                </div>

                <div className="mt-20 text-center text-sm text-gray-400 animate-slideUp" style={{ animationDelay: '0.2s' }}>
                  <p>© 2024 携程外币兑换系统 - 货币大全 v2.1</p>
                </div>
              </div>
            </div>
          ) : (
            <>
              <Header title="货币大全" onHome={() => setCurrentPage('home')} />

              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <div className="flex gap-3 mb-6">
                  <button onClick={() => setCurrentPage('home')} className="px-4 py-2 text-sm text-gray-600 hover:bg-primary-50 rounded-xl transition-colors flex items-center gap-2 font-medium">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    返回首页
                  </button>
                  <button 
                    onClick={() => setCurrentPage('query')}
                    className={`px-5 py-2 text-sm rounded-xl transition-colors font-semibold ${
                      currentPage === 'query' ? 'gradient-primary text-white shadow-lg' : 'text-gray-600 hover:bg-primary-50'
                    }`}
                  >
                    查询页面
                  </button>
                  <button 
                    onClick={() => setCurrentPage('admin')}
                    className={`px-5 py-2 text-sm rounded-xl transition-colors font-semibold ${
                      currentPage === 'admin' ? 'bg-gradient-to-r from-green-500 to-green-600 text-white shadow-lg' : 'text-gray-600 hover:bg-green-50'
                    }`}
                  >
                    数据管理
                  </button>
                </div>

                <FilterSection filters={filters} onFilterChange={handleFilterChange} currencies={currenciesState} />

                {currentPage === 'admin' && (
                  <div className="mt-6 animate-fadeIn">
                    <AdminTable 
                      currencies={filteredCurrencies} 
                      onView={setSelectedCurrency}
                      onEdit={setEditingCurrency}
                      onDelete={handleDeleteCurrency}
                      onAdd={handleAddNew}
                    />
                  </div>
                )}

                {currentPage === 'query' && (
                  <div className="bg-white rounded-2xl shadow-soft border border-gray-100 mt-6 overflow-hidden animate-fadeIn">
                    <div className="px-6 py-5 border-b-2 border-gray-100 flex items-center justify-between bg-gradient-to-r from-primary-50 to-primary-100/50">
                      <div className="flex items-center gap-3">
                        <span className="font-bold text-gray-900 text-lg">查询结果</span>
                        <span className="px-4 py-1.5 gradient-primary text-white rounded-full text-sm font-semibold shadow-lg">
                          {filteredCurrencies.length} 条记录
                        </span>
                      </div>
                    </div>

                    <div className="p-6">
                      {filteredCurrencies.length === 0 ? (
                        <div className="text-center py-20">
                          <div className="w-20 h-20 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <p className="text-gray-500 text-lg mb-2">暂无匹配的货币数据</p>
                          <p className="text-gray-400 text-sm">请调整筛选条件后重试</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                          {filteredCurrencies.map(currency => (
                            <CurrencyCard 
                              key={currency.id} 
                              currency={currency} 
                              onClick={setSelectedCurrency}
                            />
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </>
          )}

          {selectedCurrency && (
            <CurrencyDetail 
              currency={selectedCurrency} 
              onClose={() => setSelectedCurrency(null)} 
            />
          )}

          {(editingCurrency || isAddingNew) && (
            <CurrencyEditModal 
              currency={editingCurrency}
              onClose={() => {
                setEditingCurrency(null);
                setIsAddingNew(false);
              }}
              onSave={handleSaveCurrency}
            />
          )}
        </div>
      );
    };

    function renderApp() {
      try {
        if (ReactDOM.createRoot) {
          ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } else {
          ReactDOM.render(<App />, document.getElementById('root'));
        }
      } catch (e) {
        console.error('React渲染失败:', e);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(renderApp, 100);
    } else {
      document.addEventListener('DOMContentLoaded', renderApp);
      window.addEventListener('load', renderApp);
    }
  </script>
</body>
</html>
